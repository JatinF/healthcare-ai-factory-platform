apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-api
  namespace: clinical-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-api
  template:
    metadata:
      labels:
        app: inference-api
    spec:
      serviceAccountName: inference-api
      automountServiceAccountToken: false
      containers:
        - name: api
          image: registry.example.invalid/healthcare-ai-factory-api:unreleased
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HAF_TRITON_URL
              value: ""
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "500m"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: inference-api
  namespace: clinical-inference
spec:
  selector:
    app: inference-api
  ports:
    - name: http
      port: 8080
      targetPort: http
