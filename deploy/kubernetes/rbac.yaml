apiVersion: v1
kind: ServiceAccount
metadata:
  name: inference-api
  namespace: clinical-inference
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: inference-api
  namespace: clinical-inference
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: inference-api
  namespace: clinical-inference
subjects:
  - kind: ServiceAccount
    name: inference-api
    namespace: clinical-inference
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: inference-api
